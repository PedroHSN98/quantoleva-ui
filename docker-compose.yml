services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: speedtest
      POSTGRES_PASSWORD: speedtest_dev_only
      POSTGRES_DB: speedtest
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedtest"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
